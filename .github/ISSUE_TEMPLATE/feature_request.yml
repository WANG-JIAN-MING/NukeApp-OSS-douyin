name: 功能请求
description: 希望加入的功能或改进。
labels: [enhancement]
title: "[功能] "
body:
  - type: markdown
    attributes:
      value: |
        每个功能都依赖抖音的内部实现，可能随抖音更新失效。请写清楚你要什么、为什么需要。缺项的议题会被自动关闭，补全后会自动重新打开。

  - type: textarea
    id: feature
    attributes:
      label: 功能描述
      description: 想要一个什么样的功能？它应该怎么表现？
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 使用场景
      description: 你在什么情况下需要它？现在遇到了什么不方便？
    validations:
      required: true

  - type: input
    id: douyin-version
    attributes:
      label: 抖音版本
      description: 你想在哪个抖音版本上用它，例如 40.7.0。没有特别要求可以留空。
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 其他办法
      description: 你考虑过或试过的别的办法，包括用脚本实现。没有可以留空。
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认事项
      options:
        - label: 我搜索过已有的议题，没有找到同样的请求
          required: true
        - label: 我了解这个功能依赖抖音内部实现，可能随抖音更新失效
          required: true

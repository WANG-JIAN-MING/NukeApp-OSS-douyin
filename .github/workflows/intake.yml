name: Intake

# Closes an issue or a pull request that did not follow its template, with a comment that says what is missing, and
# reopens it when an edit fixes that. The checks are in .github/scripts/intake.cjs. They run from the default branch only:
# a pull request's own code is never checked out here, and its title and body are read as data and never put in a command.
on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [opened, edited, reopened]

# The latest edit of an item wins.
concurrency:
  group: intake-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    name: Template check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@v9
        with:
          script: |
            const intake = require('./.github/scripts/intake.cjs');
            const result = await intake.run({ github, context, pullRequest: context.eventName === 'pull_request_target' });
            core.info(`intake: ${result}`);
